<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bin {{ bin_id }} - bin.sinoka.dev</title>

    <meta name="description" content="View pasted content on bin.sinoka.dev (Bin ID: {{ bin_id }})">
    <meta name="robots" content="noindex, follow">
    
    <meta property="og:type" content="article">
    <meta property="og:title" content="Bin {{ bin_id }} - bin.sinoka.dev">
    <meta property="og:description" content="View pasted content on bin.sinoka.dev">

    <style>
        pre {
            white-space: pre-wrap;
            word-break: break-all;
        }

        .bin-details {
            color: #666;
            font-size: 0.8rem;
            margin: 0.25rem 0 1rem;
        }
    </style>
</head>
<body>
    <h1>Bin {{ bin_id }} - Just Another Bin Service</h1>
    <a href="/">Home</a> <a href="/raw/{{ bin_id }}">Raw</a>
    <p class="bin-details" aria-label="Bin details">{{ "{:,}".format(content_size_bytes) }} bytes · {{ "{:,}".format(content_length) }} / {{ "{:,}".format(max_content_length) }} characters · <time datetime="{{ created_at.isoformat() }}">{{ created_at.strftime("%Y-%m-%d %H:%M:%S UTC") }}</time></p>
    <pre><code>{{ bin_content }}</code></pre>
</body>
</html>
